[project]
name = "kinetics-ent"
version = "0.1.0"
description = "Data, benchmarks and models for triplet energy transfer kinetics"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Niklas Hölter" },
    { name = "Leon Schlosser" },
]

# Deliberately empty. Every script under data/ declares its own dependencies in a
# PEP 723 header and runs standalone under `uv run`, so nothing has to be installed
# to reproduce the data pipeline. Only the optional groups below need resolving.
dependencies = []

[project.optional-dependencies]
# The theory benchmarks.
benchmark = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

# The models and the prediction API. `pyrates` is the package in ml/, installed from
# its own pyproject.toml, which is what pins torch, torch-geometric, rdkit and the
# rest. Kept out of the default install because it is a multi-gigabyte dependency
# tree that the data pipeline does not need.
#
#   uv sync --extra ml
ml = [
    "pyrates",
]

[tool.uv.sources]
pyrates = { path = "ml", editable = true }

[tool.uv]
# This repository is a collection of scripts, not an installable package. Keeping it
# unbuilt means `uv run reproduce.py` does not drag in the ml extra on every call.
package = false
