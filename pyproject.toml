[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetics-ent"
version = "0.1.0"
description = "Data, benchmarks and models for triplet energy transfer kinetics"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Niklas Hölter" },
    { name = "Leon Schlosser" },
]

# Deliberately empty. Every script under data/ declares its own dependencies in a
# PEP 723 header and runs standalone under `uv run`, so nothing has to be installed
# to reproduce the data pipeline. Only the optional groups below need resolving.
dependencies = []

[project.optional-dependencies]
# The theory benchmarks.
benchmark = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

# The `ml` package: the graph MDN, its training and inference, and the prediction
# API and CLI built on them. A multi-gigabyte tree, which is why it is optional --
# the data pipeline and the benchmark never need it.
#
#   uv sync --extra ml
ml = [
    "numpy==2.4.2",
    "pandas==2.3.3",
    "scipy>=1.14",
    "matplotlib==3.10.8",
    "rdkit==2025.9.4",
    "scikit-learn==1.8.0",
    "joblib>=1.4",
    "torch==2.5.1",
    "torch-geometric==2.7.0",
    "openpyxl==3.1.5",
]

# The `webapp` package: EnTdecker. It is a consumer of `ml`, so it takes that extra
# whole and adds only what serving the page needs.
#
#   uv sync --extra webapp
webapp = [
    "kinetics-ent[ml]",
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "pydantic>=2",
    "plotly==6.6.0",
    "pillow>=10",
]

[project.scripts]
ent-ml = "ml.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

# ml/ and webapp/ are the two packages. Everything else in the tree -- data/,
# benchmark/, reproduce.py -- is scripts, and neither package may reach into them.
[tool.setuptools.packages.find]
include = ["ml*", "webapp*"]
exclude = ["ml.tests*", "ml.training*", "webapp.tests*", "webapp.deploy*"]

[tool.setuptools.package-data]
"ml.data" = ["model_final.pt"]
"webapp.data" = ["photocatalysts.csv", "pc_structures/*.png"]
"webapp" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "webapp/tests"]
