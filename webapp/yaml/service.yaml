apiVersion: v1
kind: Service
metadata:
  name: frontend
  annotations:
    # Introduce the service to Istio.
    # Otherwise it is unknown to the Istio Ingressgateway and not
    # accesable via the ingress.
    networking.istio.io/exportTo: istio-ingressgateway
  labels:
    app: nginx
    component: frontend
    release: webserver
spec:
  selector:
    app: nginx
    component: frontend
    release: webserver
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http